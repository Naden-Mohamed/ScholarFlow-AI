services:
  app:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: scholarflow_ai
    ports:
      - "8000:8000"
    volumes:
      - ../src:/app
    depends_on:
      - qdrant
      - pgvector  
    env_file:
      - ../src/.env 

  qdrant:
    image: qdrant/qdrant:latest
    container_name: qdrant_db
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    restart: always

  pgvector:
    image: pgvector/pgvector:0.8.4-pg17 
    container_name: pgvector
    ports:
      - "5432:5432"
    volumes:
      - pgvector_data:/var/lib/postgresql/data 
    environment:
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    restart: always

volumes:
  qdrant_data:
  pgvector_data: