services:
  app:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: scholarflow_ai
    ports:
      - "8000:8000"
    volumes:
      - ../src:/app
    depends_on:
      - qdrant
    env_file:
      - ../src/.env 

  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage

volumes:
  qdrant_data: